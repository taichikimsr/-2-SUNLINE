name: メルカリお得品アラート

on:
  schedule:
    # 時刻は UTC 指定。23:17 UTC = 日本時間 8:17（毎日）
    # 回数を増やす場合は行を追加（例: 日本時間 20:17 → "17 11 * * *"）
    - cron: "17 23 * * *"
  workflow_dispatch: {}   # Actions 画面から手動実行も可能

permissions:
  contents: write   # 通知済み記録（state/seen.json）をコミットするため

concurrency:
  group: mercari-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mercari-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mercari-alert/requirements.txt

      - name: 依存関係のインストール
        run: pip install -r requirements.txt

      - name: お得品チェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m mercari_alert.main

      - name: 通知済み記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "記録の変更なし"
            exit 0
          fi
          git commit -m "メルカリアラート: 通知済み記録を更新 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
