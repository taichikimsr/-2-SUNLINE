# =====================================================================
# メルカリお得品アラート 設定ファイル
#  - 監視したい商品を watches に追加・編集してください。
#  - 下の watches はあくまで「書き方の例」です。金額は付属品等を除外する
#    ための下限の目安で、実際の相場ではありません。必ずご自身で調整してください。
# =====================================================================

settings:
  # 相場より何%以上安ければ通知するか（0.25 = 25%以上安い）
  discount_threshold: 0.25

  # 相場のこの割合未満の価格は「安すぎる（偽物・付属品・誤記の疑い）」として
  # 通知に警告を付ける（0.35 = 相場の35%未満）。通知自体はされます。
  suspicious_ratio: 0.35

  # 売り切れ商品から相場（中央値）を自動算出する際に必要な最低件数。
  # これ未満で reference_price も未設定の場合は、その監視は判定をスキップします。
  min_sold_samples: 5

  # reference_price を設定した監視でも売り切れ商品を取得し、参考値として通知に表示するか。
  # false にすると reference_price 設定時はリクエストが1回減ります。
  always_fetch_sold: true

  # 1回の実行で1つの監視から送る通知の上限（初回実行時の大量通知を防ぐ）
  max_alerts_per_watch: 10

  # メルカリへのリクエスト間隔（秒）。この範囲でランダムに待ちます。
  # 負荷をかけないため、短くしないでください。
  request_interval_sec: [4, 8]

  # 毎回の実行後に「チェック完了」のまとめを Discord に送るか
  # （お得品がなくても動作していることを確認できます）
  notify_summary: true

  # メルカリShops の出品・オークション形式の出品を含めるか（監視ごとに上書き可）
  include_shops: true
  include_auctions: true

  # 価格・状態の絞り込みをメルカリ側の検索条件にも渡すか。
  # 渡した結果エラーになる場合は自動で条件なし検索に切り替え、手元で絞り込みます。
  server_side_filters: true

  # 「箱のみ」「レプリカ」などの既定の除外語を使うか（一覧は mercari_alert/analyzer.py）
  use_default_exclude_words: true
  # 全監視に共通で追加する除外語（商品名に含まれていたら除外）
  exclude_words: []

# ---------------------------------------------------------------------
# 監視する商品
#   name             : 通知に表示する名前（省略時は keyword）
#   keyword          : メルカリでの検索語。型番まで入れると精度が上がります（必須）
#   required_words   : 商品名にすべて含まれている必要がある語（任意）
#   exclude_words    : 除外語。商品名に含まれていたら除外（任意）
#                      ※「コマ」「文字盤」のように本物の出品の商品名にも普通に出てくる語は
#                        入れないでください（「余りコマ付き」等まで除外されます）
#   search_exclude   : メルカリ側の検索の「除外キーワード」に渡す語（任意）。
#                      説明文にも効く可能性があるため、確実に不要な語だけにしてください
#   price_min/max    : 価格の下限・上限（円、任意）。付属品や別商品の除外に有効
#   condition_ids    : 商品の状態（任意）。1=新品、未使用 2=未使用に近い
#                      3=目立った傷や汚れなし 4=やや傷や汚れあり 5=傷や汚れあり
#                      6=全体的に状態が悪い
#   reference_price  : 自分で調べた中古相場（円、任意）。設定するとこれを基準に判定。
#                      未設定なら、同じ条件の売り切れ商品の中央値を相場として使います。
#   discount_threshold / suspicious_ratio : settings の値を監視ごとに上書き（任意）
#   enabled          : false にするとこの監視を一時停止
# ---------------------------------------------------------------------
watches:
  - name: ロレックス サブマリーナ 116610LN
    keyword: ロレックス サブマリーナ 116610LN
    # exclude_words: [ノンデイト]   # 例：別モデルを除外したい場合
    price_min: 300000
    condition_ids: [1, 2, 3, 4]
    # reference_price: 0   # ← ご自身で調べた相場を入れる場合はコメントを外して金額を記入

  - name: オメガ スピードマスター プロフェッショナル
    keyword: オメガ スピードマスター プロフェッショナル
    price_min: 100000
    condition_ids: [1, 2, 3, 4]

  - name: グランドセイコー
    keyword: グランドセイコー
    price_min: 50000
    condition_ids: [1, 2, 3, 4]
    enabled: false   # 例：範囲が広すぎる検索語は相場がぶれるため、型番で絞るのがおすすめ
